[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

# Old URLs, kept alive for links and search
[[redirects]]
  from = "/work/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/work"
  to = "/"
  status = 301
[[redirects]]
  from = "/scripted"
  to = "/portfolio/"
  status = 301
[[redirects]]
  from = "/mini-films"
  to = "/portfolio/"
  status = 301
[[redirects]]
  from = "/work-with-me"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/services/*"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/services"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/nikon-f2"
  to = "/"
  status = 301

# Fingerprinted build assets never change
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Studio HQ stays private and out of search
[[headers]]
  for = "/hq/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
