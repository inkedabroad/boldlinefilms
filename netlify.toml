[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

# Old URLs, kept alive for links and search
[[redirects]]
  from = "/portfolio"
  to = "/#work"
  status = 301
[[redirects]]
  from = "/mini-films"
  to = "/#work"
  status = 301
[[redirects]]
  from = "/work"
  to = "/#work"
  status = 301
[[redirects]]
  from = "/work-with-me"
  to = "/#inquire"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/#inquire"
  status = 301
[[redirects]]
  from = "/services/*"
  to = "/#inquire"
  status = 301
[[redirects]]
  from = "/services"
  to = "/#inquire"
  status = 301
[[redirects]]
  from = "/about"
  to = "/"
  status = 301
[[redirects]]
  from = "/nikon-f2"
  to = "/"
  status = 301

# Studio HQ stays private and out of search
[[headers]]
  for = "/hq/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
